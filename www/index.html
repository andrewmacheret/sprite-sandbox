<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

<meta property="og:url" content="https://andrewmacheret.com/projects/sprite-sandbox/" />
<meta property="og:image" content="https://andrewmacheret.com/projects/sprite-sandbox/sprites_screenshot_small.png" />
<meta property="og:title" content="Sprite Sandbox" />
<meta property="og:description" content="Move dudes around with arrow keys. Exciting!" />
<meta property="og:type" content="website" />

<title>Sprite Sandbox</title>
<script async src="https://andrewmacheret.com/analytics.js"></script>
<meta name="description" content="Move 2D characters around a sandbox with the arrow keys." />
<link rel="canonical" href="https://andrewmacheret.com/projects/sprite-sandbox/" />

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.23.0/dist/pixi.min.js" integrity="sha384-IGfYrdVH+mWT/lAfomOiw9gRIY0pOGCN3enQE3TBB6FWluTVVh4hlXDzNotZYUcv" crossorigin="anonymous" defer></script>
<script src="index.js" defer></script>

<link rel="stylesheet" href="https://andrewmacheret.com/projects.css" />
<link rel="stylesheet" type="text/css" href="index.css" />

</head>

<body>
<main class="app">
  <header class="header">
    <div>
      <h1>Sprite Sandbox</h1>
      <p>Pick a character and walk it around.</p>
    </div>
    <p class="pill" aria-live="polite"><strong id="bump-count">0</strong> <span id="bump-label">bumps</span></p>
  </header>

  <section class="stage">
    <div id="container" class="field"><p class="loading">Loading&hellip;</p></div>
  </section>

  <div class="dock">
    <div class="dock-main">
      <div class="toolbar">
        <button type="button" class="control" id="random-button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
          Random character
        </button>
        <button type="button" class="control" id="wander-button" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M2 12h20"/><path d="m15 19-3 3-3-3M19 9l3 3-3 3M9 5l3-3 3 3M5 9l-3 3 3 3"/></svg>
          Wander
        </button>
        <button type="button" class="control" id="conga-button" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Conga line
        </button>
        <button type="button" class="control" id="dance-button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          Dance party
        </button>
      </div>
      <p class="hint">
        <span class="hint-keys">
          <kbd aria-label="up">&uarr;</kbd><kbd aria-label="down">&darr;</kbd><kbd aria-label="left">&larr;</kbd><kbd aria-label="right">&rarr;</kbd> to walk,
          <kbd class="wide">Space</kbd> to jump. Click someone to switch.</span>
        <span class="hint-touch">Tap someone to switch, tap again to jump, hold an arrow to walk.</span>
      </p>
    </div>
    <div class="dpad" role="group" aria-label="Move the selected character">
      <button type="button" class="control round up" data-direction="up" aria-label="Up">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
      </button>
      <button type="button" class="control round left" data-direction="left" aria-label="Left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <button type="button" class="control round down" data-direction="down" aria-label="Down">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button type="button" class="control round right" data-direction="right" aria-label="Right">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <footer class="footer">
    <a href="https://andrewmacheret.com/">More projects</a>
    <span aria-hidden="true">&middot;</span>
    <a href="https://github.com/andrewmacheret/sprite-sandbox">Source</a>
  </footer>
</main>
</body>
</html>
